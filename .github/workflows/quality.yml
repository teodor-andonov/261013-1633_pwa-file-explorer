name: Fold quality checks

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''
      - name: Parse app and run file operation tests
        run: npm run check
